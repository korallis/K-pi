# Adapted from Ray Fernando's React Doctor workflow.
# K-pi has no React surface. Keep this advisory slot on the repository's static
# doctor until React is introduced; then replace the final step with
# millionco/react-doctor@v2 and scope it to the React workspace.

name: React Doctor

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    # Same-repository only on pull_request: forks never get a checkout of untrusted
    # head on any runner for this advisory slot. Hosted Ubuntu (not the Mac mini).
    if: >-
      github.event_name != 'pull_request'
      || (github.event.pull_request.draft == false
          && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          cache: npm


      - name: Install dependencies
        run: npm ci --ignore-scripts --prefer-offline --no-audit --fund=false

      - name: Run advisory static doctor
        continue-on-error: true
        run: npm run check
