name: ci

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm add --save-dev --save-exact @earendil-works/pi-coding-agent@0.84.4
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm kstack:sync:check

  upstream:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm kstack:sync
      - uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/kstack-upstream
          commit-message: "chore(kstack): sync upstream overlay"
          title: "chore(kstack): sync upstream overlay"
          body: "Automated K-stack upstream refresh. Review generated changes; this workflow never merges."
