# Required, read-only Grok review gate.
#
# The Copilot credential can request inference only. GitHub's ephemeral token is
# introduced later, in the comment step, so Grok and PR-controlled content never
# receive repository write credentials. The model gets the diff as inert prompt
# data and no tools: no shell, file writes, MCP, push, or autofix.
#
# Trust boundary:
#   - Copilot CLI is installed before any repository checkout, with an empty
#     npmrc, so a PR .npmrc cannot redirect the install.
#   - Base is checked out for trusted gate scripts; head is checked out only as
#     a read-only diff source in a sibling worktree.
#   - Gate scripts run from base when present. Head is used solely to introduce
#     scripts on the landing PR that adds them.
#   - Inference clears GITHUB_TOKEN/GH_TOKEN so the write-capable job token never
#     reaches the model or the PR diff prompt.
#
# Latency bound (15m job, effort high only):
#   - At the fork-import boundary, select-grok-review-input proves and drops
#     byte-identical pinned upstream blobs and check-covered generated/lock
#     artifacts (upstream.json + UPSTREAM.md + kstack/lockfile/model-data gates).
#   - Only first-party K-π delta and patched-upstream files reach Grok.
#   - That reduced diff is partitioned on file boundaries into deterministic
#     size-capped chunks and reviewed concurrently with hard per-chunk timeouts.
#   - Every chunk must validate; findings are unioned/deduped deterministically.
#   - Any provenance failure, chunk timeout, inference error, or invalid schema
#     fails the gate.
#
# Hosted Ubuntu is deliberate. AI review does not need the Mac mini, must not
# occupy the hard-gate queue, and must not leave model state on a persistent
# self-hosted runner.

name: grok-review

on:
  pull_request:
    branches: [main, architecture/pi-fork-harness]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: grok-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Grok review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event.pull_request.draft == false
    env:
      GIT_CONFIG_GLOBAL: /dev/null
      GIT_CONFIG_SYSTEM: /dev/null
      GIT_TERMINAL_PROMPT: "0"
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      GROK_REVIEW_MODEL: ${{ vars.GROK_REVIEW_MODEL }}
    steps:
      - name: Refuse forks and missing reviewer configuration
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPOSITORY" != "$REPOSITORY" ]; then
            echo "::error::Grok review refuses fork code because pull_request secrets are unavailable."
            exit 1
          fi
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::COPILOT_GITHUB_TOKEN is not configured."
            exit 1
          fi
          case "$GROK_REVIEW_MODEL" in
            grok-[A-Za-z0-9._-]*) ;;
            *)
              echo "::error::GROK_REVIEW_MODEL must name a Grok model."
              exit 1
              ;;
          esac

      # Toolchain and Copilot install happen before any repository checkout so a
      # PR-controlled .npmrc or package tree cannot influence the CLI install.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.19.0
          package-manager-cache: false

      - name: Install pinned Copilot CLI
        env:
          HOME: ${{ runner.temp }}/npm-home
          NPM_CONFIG_USERCONFIG: ${{ runner.temp }}/empty-user-npmrc
          NPM_CONFIG_GLOBALCONFIG: ${{ runner.temp }}/empty-global-npmrc
          npm_config_cache: ${{ runner.temp }}/npm-cache
        run: |
          mkdir -p "$HOME" "$npm_config_cache"
          : > "$NPM_CONFIG_USERCONFIG"
          : > "$NPM_CONFIG_GLOBALCONFIG"
          npm install --global @github/copilot@1.0.82 --ignore-scripts --no-audit --fund=false

      - name: Checkout base for trusted gate scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          path: trusted
          persist-credentials: false

      - name: Checkout head for diff source only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          path: untrusted
          persist-credentials: false


      - name: Prepare bounded review input
        run: |
          # Bring BASE_SHA into the head clone without network credentials. The
          # base tip is not always an ancestor of HEAD once the base branch moves,
          # so the three-dot diff must see both commits explicitly.
          if ! git -C untrusted cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git -C untrusted fetch --no-tags "$GITHUB_WORKSPACE/trusted" "$BASE_SHA"
          fi
          git -C untrusted cat-file -e "$BASE_SHA^{commit}"
          git -C untrusted cat-file -e "$HEAD_SHA^{commit}"

          # Prefer base copies of the gate scripts (trusted TCB). Head copies are
          # only for the landing PR that introduces them onto the base.
          mkdir -p "$RUNNER_TEMP/gate-scripts"
          for script in \
            validate-grok-review.mjs \
            partition-pr-diff.mjs \
            run-chunked-grok-review.mjs \
            select-grok-review-input.mjs
          do
            if [ -f "trusted/scripts/$script" ]; then
              cp "trusted/scripts/$script" "$RUNNER_TEMP/gate-scripts/$script"
            elif [ -f "untrusted/scripts/$script" ]; then
              cp "untrusted/scripts/$script" "$RUNNER_TEMP/gate-scripts/$script"
            else
              echo "::error::scripts/$script is missing on base and head."
              exit 1
            fi
          done

          # Pin trust: base/trusted upstream.json always wins when present. A PR
          # must not retarget the pin to a commit it carries in order to exclude
          # packages/** as "byte-identical-to-pin". Head pin is bootstrap-only
          # (base has no pin) and is validated to the architecture pin inside
          # select-grok-review-input.mjs.
          pin_base_args=()
          pin_head_args=()
          if [ -f trusted/upstream.json ]; then
            pin_base_args=(--pin-base "$GITHUB_WORKSPACE/trusted/upstream.json")
            pin_commit=$(node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!/^[0-9a-f]{40}$/i.test(p.commit||"")) process.exit(2); process.stdout.write(String(p.commit).toLowerCase())' "$GITHUB_WORKSPACE/trusted/upstream.json") || {
              echo "::error::trusted upstream.json commit is missing or malformed."
              exit 1
            }
          elif [ -f untrusted/upstream.json ]; then
            pin_head_args=(--pin-head "$GITHUB_WORKSPACE/untrusted/upstream.json")
            pin_commit=$(node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); if(!/^[0-9a-f]{40}$/i.test(p.commit||"")) process.exit(2); process.stdout.write(String(p.commit).toLowerCase())' "$GITHUB_WORKSPACE/untrusted/upstream.json") || {
              echo "::error::head upstream.json commit is missing or malformed."
              exit 1
            }
          else
            echo "::error::upstream.json missing on base and head; cannot prove fork provenance."
            exit 1
          fi

          # Pin objects must be local before byte-identity proofs. Prefer objects
          # already in the head clone; otherwise import from the base clone only
          # (no credentials, no upstream network). Never take pin *identity*
          # from head when base has a pin — only the object bytes for that SHA.
          if ! git -C untrusted cat-file -e "${pin_commit}^{commit}" 2>/dev/null; then
            if git -C trusted cat-file -e "${pin_commit}^{commit}" 2>/dev/null; then
              git -C untrusted fetch --no-tags "$GITHUB_WORKSPACE/trusted" "$pin_commit"
            else
              echo "::error::pinned upstream commit ${pin_commit} is not in base or head object stores."
              exit 1
            fi
          fi
          git -C untrusted cat-file -e "${pin_commit}^{commit}"

          node "$RUNNER_TEMP/gate-scripts/select-grok-review-input.mjs" \
            --repo "$GITHUB_WORKSPACE/untrusted" \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            "${pin_base_args[@]}" \
            "${pin_head_args[@]}" \
            --out-diff "$RUNNER_TEMP/pr.diff" \
            --out-paths "$RUNNER_TEMP/changed-paths" \
            --out-meta "$RUNNER_TEMP/grok-input-meta.json"

          jq -c '{selectedDiffBytes,fullDiffBytes,counts,pin}' "$RUNNER_TEMP/grok-input-meta.json"


      - name: Run concurrent chunked Grok review
        id: inference
        continue-on-error: true
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          GITHUB_TOKEN: ""
          GH_TOKEN: ""
          HOME: ${{ runner.temp }}/copilot-home
        run: |
          mkdir -p "$HOME" "$RUNNER_TEMP/chunked-review"
          set +e
          node "$RUNNER_TEMP/gate-scripts/run-chunked-grok-review.mjs" \
            --diff "$RUNNER_TEMP/pr.diff" \
            --changed-paths "$RUNNER_TEMP/changed-paths" \
            --model "$GROK_REVIEW_MODEL" \
            --out-json "$RUNNER_TEMP/grok-review.json" \
            --out-meta "$RUNNER_TEMP/grok-review-meta.json" \
            --work-dir "$RUNNER_TEMP/chunked-review" \
            --effort high \
            --max-chunk-bytes 96000 \
            --max-concurrency 20 \
            --chunk-timeout-sec 720 \
            --max-ai-credits 50
          status=$?
          set -e
          # Always surface model/chunk meta for the sticky comment, including fail-closed runs.
          if [ -f "$RUNNER_TEMP/grok-review-meta.json" ]; then
            model=$(jq -r '.model // empty' "$RUNNER_TEMP/grok-review-meta.json")
            chunks=$(jq -r '.chunkCount // empty' "$RUNNER_TEMP/grok-review-meta.json")
            echo "model=$model" >> "$GITHUB_OUTPUT"
            echo "chunks=$chunks" >> "$GITHUB_OUTPUT"
            jq -c '.' "$RUNNER_TEMP/grok-review-meta.json"
          fi
          if [ -f "$RUNNER_TEMP/grok-review.json" ]; then
            count=$(jq -r 'length' "$RUNNER_TEMP/grok-review.json")
            echo "count=$count" >> "$GITHUB_OUTPUT"
          fi
          exit "$status"

      - name: Upload Grok review artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: grok-review-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/grok-review.json
            ${{ runner.temp }}/grok-review-meta.json
            ${{ runner.temp }}/grok-input-meta.json
            ${{ runner.temp }}/changed-paths
            ${{ runner.temp }}/chunked-review/**
          if-no-files-found: warn
          retention-days: 14

      - name: Publish sticky review result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          INFERENCE_OUTCOME: ${{ steps.inference.outcome }}
          FINDING_COUNT: ${{ steps.inference.outputs.count }}
          REVIEW_MODEL: ${{ steps.inference.outputs.model }}
          CHUNK_COUNT: ${{ steps.inference.outputs.chunks }}
        run: |
          report="$RUNNER_TEMP/grok-review-comment.md"
          # GitHub issue comment body soft limit ~65536; keep headroom for JSON wrap.
          COMMENT_BODY_MAX=60000
          {
            echo '<!-- kpi-grok-review -->'
            echo '## Grok review'
            echo
            if [ -n "$REVIEW_MODEL" ] || [ -n "$CHUNK_COUNT" ] || [ -f "$RUNNER_TEMP/grok-input-meta.json" ]; then
              echo "- Model: \`${REVIEW_MODEL:-unknown}\`"
              echo "- Chunks: \`${CHUNK_COUNT:-unknown}\`"
              if [ -f "$RUNNER_TEMP/grok-input-meta.json" ]; then
                selected=$(jq -r '.selectedDiffBytes // empty' "$RUNNER_TEMP/grok-input-meta.json")
                total=$(jq -r '.fullDiffBytes // empty' "$RUNNER_TEMP/grok-input-meta.json")
                included=$(jq -r '.counts.included // empty' "$RUNNER_TEMP/grok-input-meta.json")
                changed=$(jq -r '.counts.changedPaths // empty' "$RUNNER_TEMP/grok-input-meta.json")
                identical=$(jq -r '.counts.byteIdenticalToPin // empty' "$RUNNER_TEMP/grok-input-meta.json")
                covered=$(jq -r '.counts.coveredArtifact // empty' "$RUNNER_TEMP/grok-input-meta.json")
                pin=$(jq -r '.pin.tag // empty' "$RUNNER_TEMP/grok-input-meta.json")
                echo "- Pin: \`${pin:-unknown}\`"
                echo "- Provenance coverage: \`${selected:-?}\` / \`${total:-?}\` diff bytes; paths \`${included:-?}\` / \`${changed:-?}\` (excluded byte-identical-to-pin=\`${identical:-0}\`, check-covered=\`${covered:-0}\`)"
              fi
              if [ -f "$RUNNER_TEMP/grok-review-meta.json" ]; then
                cap=$(jq -r '.adaptiveUnionCap // empty' "$RUNNER_TEMP/grok-review-meta.json")
                overflow=$(jq -r '.overflow // false' "$RUNNER_TEMP/grok-review-meta.json")
                fcount=$(jq -r '.findingCount // .partialFindingCount // empty' "$RUNNER_TEMP/grok-review-meta.json")
                echo "- Adaptive union cap: \`${cap:-n/a}\`"
                echo "- Findings (artifact): \`${fcount:-n/a}\`"
                if [ "$overflow" = "true" ]; then
                  echo "- **Overflow:** validated findings exceeded the adaptive hard cap; full list is in the workflow artifact (not truncated)."
                fi
              fi
              echo
              echo "Full raw + validated findings are uploaded as the \`grok-review-*\` artifact."
              echo
            fi
            if [ "$INFERENCE_OUTCOME" != "success" ]; then
              overflow=$(jq -r '.overflow // false' "$RUNNER_TEMP/grok-review-meta.json" 2>/dev/null || echo false)
              if [ "$overflow" = "true" ]; then
                echo '**Failed closed:** union exceeded the adaptive hard cap after dedupe. Full validated findings are in the artifact and summarized below when space allows.'
              else
                echo '**Failed closed:** Grok review did not complete (provenance reduction, timeout, inference error, invalid schema, or overflow). Inspect the required workflow log and artifact.'
              fi
              if [ -f "$RUNNER_TEMP/grok-review-meta.json" ]; then
                echo
                echo 'Chunk outcomes:'
                echo
                jq -r '.chunks[]? | "- chunk \(.index): \(.reason // "unknown") (\(.bytes // 0) bytes, \(.durationMs // 0) ms, findings=\(.findingCount // "n/a"))"' \
                  "$RUNNER_TEMP/grok-review-meta.json"
              fi
            elif [ -z "$FINDING_COUNT" ]; then
              echo '**Failed closed:** Grok review produced no validated finding document.'
            elif [ "$FINDING_COUNT" = "0" ]; then
              echo 'No blocking P0–P2 defects found in this revision.'
            else
              echo "**Blocking findings:** \`$FINDING_COUNT\` (gate fails on every validated finding; full list in artifact)."
              echo
            fi

            # Append findings when present (success with findings OR overflow/partial
            # artifacts). Cap total comment size; never truncate the artifact JSON.
            if [ -f "$RUNNER_TEMP/grok-review.json" ]; then
              count=$(jq -r 'length' "$RUNNER_TEMP/grok-review.json")
              if [ "$count" != "0" ]; then
                echo
                echo '### Findings'
                echo
                jq -r '.[] | "### \(.severity): \(.title)\n\n- `\(.path)`" + (if .line == null then "" else ":\(.line)" end) + "\n- ID: `\(.id)`\n\n\(.body)\n"' \
                  "$RUNNER_TEMP/grok-review.json" >> "$RUNNER_TEMP/grok-findings-body.md" || true
              fi
            fi
          } > "$report"

          if [ -f "$RUNNER_TEMP/grok-findings-body.md" ]; then
            current=$(wc -c < "$report" | tr -d ' ')
            remain=$((COMMENT_BODY_MAX - current))
            if [ "$remain" -gt 500 ]; then
              # Append complete finding sections only; never mid-truncate a section.
              node -e '
                const fs = require("fs");
                const remain = Number(process.argv[1]);
                const body = fs.readFileSync(process.argv[2], "utf8");
                const reportPath = process.argv[3];
                const sections = body.split("\n### ");
                const out = [];
                let used = 0;
                let omitted = 0;
                for (let i = 0; i < sections.length; i++) {
                  const chunk = i === 0 ? sections[i] : "### " + sections[i];
                  if (!chunk.trim()) continue;
                  const size = Buffer.byteLength(chunk, "utf8");
                  if (used + size > remain) {
                    omitted += sections.length - i;
                    break;
                  }
                  out.push(chunk);
                  used += size;
                }
                let extra = out.join("");
                if (omitted > 0) {
                  extra += "\n\n_" + omitted + " additional finding section(s) omitted from the sticky comment; see the workflow artifact for the full validated list._\n";
                }
                fs.appendFileSync(reportPath, extra);
              ' "$remain" "$RUNNER_TEMP/grok-findings-body.md" "$report"
            else
              echo >> "$report"
              echo '_Findings omitted from the sticky comment due to size; see the workflow artifact for the full validated list._' >> "$report"
            fi
          fi

          # Hard cap the comment payload as a last resort (artifact remains full).
          node -e '
            const fs = require("fs");
            const limit = Number(process.argv[1]);
            const path = process.argv[2];
            const raw = fs.readFileSync(path);
            if (raw.length > limit) {
              const note = "\n\n_Comment truncated for GitHub size limits; full validated findings are in the workflow artifact._\n";
              const keep = Math.max(0, limit - Buffer.byteLength(note, "utf8"));
              const clipped = raw.subarray(0, keep).toString("utf8").replace(/\uFFFD$/u, "").trimEnd() + note;
              fs.writeFileSync(path, clipped);
            }
          ' "$COMMENT_BODY_MAX" "$report"


          jq -n --rawfile body "$report" '{body: $body}' > "$RUNNER_TEMP/grok-review-comment.json"
          comment_id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | contains("<!-- kpi-grok-review -->")) | .id' \
            | head -1)
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" \
              --input "$RUNNER_TEMP/grok-review-comment.json" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
              --input "$RUNNER_TEMP/grok-review-comment.json" > /dev/null
          fi

      - name: Enforce review result
        if: always()
        env:
          INFERENCE_OUTCOME: ${{ steps.inference.outcome }}
          FINDING_COUNT: ${{ steps.inference.outputs.count }}
        run: |
          overflow=false
          if [ -f "$RUNNER_TEMP/grok-review-meta.json" ]; then
            overflow=$(jq -r '.overflow // false' "$RUNNER_TEMP/grok-review-meta.json")
          fi
          if [ "$overflow" = "true" ]; then
            echo "::error::Grok review failed closed: validated findings exceeded the adaptive hard union cap. Full findings are in the artifact."
            exit 1
          fi
          if [ "$INFERENCE_OUTCOME" != "success" ] || [ -z "$FINDING_COUNT" ]; then
            echo "::error::Grok review failed closed."
            exit 1
          fi
          if [ "$FINDING_COUNT" != "0" ]; then
            echo "::error::Grok reported $FINDING_COUNT blocking finding(s)."
            exit 1
          fi
